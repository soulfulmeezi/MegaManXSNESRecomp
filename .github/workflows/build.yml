name: Desktop host
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev libgl1-mesa-dev
      - name: Configure ROM-free setup host
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_SDL_BACKEND=SDL2 -DSNESRECOMP_SETUP_HOST=ON
      - name: Compile shared desktop host and game adapters
        run: cmake --build build --target MegaManXSNESRecomp RockmanXSNESRecomp --parallel 4
      - name: Check ROM-free display, Zero, CPU companion and Cosmic core
        run: cmake --build build --target mmx_display_test mmx_wide_policy_test mmx_renderer_test mmx_password_save_test mmx_zero_test mmx_cpu_antistuck_test mmx_cpu_deep_descent_test mmx_cpu_jump_learning_test mmx_future_zero_test mmx_cosmic_core_test mmx_cosmic_legacy_bridge_test mmx_near_road_showcase_test && ctest --test-dir build --output-on-failure
